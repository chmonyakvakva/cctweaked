<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Base Control</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        .panel {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: #1c1c1c;
            border-radius: 15px;
        }

        #status {
            font-size: 30px;
            margin: 30px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 18px 30px;
            margin: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .on {
            background: #2ecc71;
            color: white;
        }

        .off {
            background: #e74c3c;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }
    </style>
</head>

<body>

<div class="panel">

    <h1> Достижения </h1>

    <div id="status">
        ⏳ Загрузка...
    </div>

    <button class="on" onclick="setShield('on')">
        🟢 Открыть спуск
    </button>

    <button class="off" onclick="setShield('off')">
        🔴 закрыть спуск
    </button>

</div>

<script>

const API = "https://mc-control.chmonyakvakva.workers.dev";

async function updateStatus() {
    try {
        const response = await fetch(API + "/status");
        const data = await response.json();

        if (data.shield === "on") {
            document.getElementById("status").innerText =
                "🟢 Спуск открыт";
        } else {
            document.getElementById("status").innerText =
                "🔴 Спуск закрыт";
        }

    } catch (error) {
        document.getElementById("status").innerText =
            "⚠️ НЕТ СОЕДИНЕНИЯ";
    }
}


async function setShield(state) {

    const buttons = document.querySelectorAll("button");

    buttons.forEach(button => {
        button.disabled = true;
    });

    try {

        const response = await fetch(
            API + "/shield/" + state,
            {
                method: "POST"
            }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        await updateStatus();

    } catch (error) {

        document.getElementById("status").innerText =
            "⚠️ ОШИБКА";

        console.error(error);

    } finally {

        buttons.forEach(button => {
            button.disabled = false;
        });
    }
}


updateStatus();

</script>

</body>
</html>
