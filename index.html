<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Base Control</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        .panel {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: #1c1c1c;
            border-radius: 15px;
        }

        #status {
            font-size: 30px;
            margin: 30px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 18px 30px;
            margin: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .on {
            background: #2ecc71;
            color: white;
        }

        .off {
            background: #e74c3c;
            color: white;
        }
    </style>
</head>

<body>

<div class="panel">

    <h1>🛡️ BASE CONTROL</h1>

    <div id="status">
        🔴 ЩИТ ВЫКЛЮЧЕН
    </div>

    <button class="on" onclick="setShield('on')">
        🟢 ВКЛЮЧИТЬ ЩИТ
    </button>

    <button class="off" onclick="setShield('off')">
        🔴 ВЫКЛЮЧИТЬ ЩИТ
    </button>

</div>

<script>

async function setShield(state) {

    /*
        Пока API не подключён.
        Просто показываем изменение состояния.
    */

    if (state === "on") {
        document.getElementById("status").innerText =
            "🟢 ЩИТ ВКЛЮЧЕН";
    }

    if (state === "off") {
        document.getElementById("status").innerText =
            "🔴 ЩИТ ВЫКЛЮЧЕН";
    }
}

</script>

</body>
</html>
